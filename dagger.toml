# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

# Marker filename that skips generate when found at or above a PHP SDK module root.
# settings.skipGenerateFilename = ""

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.php-sdk]
source = "."
check.skip = ["*"]

[modules.sdk-sdk]
source = "github.com/dagger/sdk-sdk"

[modules.php-sdk.as-sdk]
name = "php"

[[modules.php-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/generate/app"

[[modules.php-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/rooting/app"

[[modules.php-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/lookup/app"

[[modules.php-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/toml/app"

[[modules.php-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/mixed-discovery/ancestor/work/app"
